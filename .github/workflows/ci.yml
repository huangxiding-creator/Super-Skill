name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner
        run: python -m pip install --quiet pytest pyyaml
      - name: git identity (tests create repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Full check suite (engine, hooks, installer, evolver, sub-skills, bench, structure)
        run: python .claude/skills/super-skill/scripts/run_all_tests.py
      - name: Daily self-update tests (radar, whitelist, end-to-end with fake claude + bare origin)
        run: python -m pytest -q -p no:cacheprovider automation/tests

  fresh-install:
    name: fresh machine install · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Global install + hooks + doctor on a clean runner
        run: python install.py --global --hooks
      - name: Doctor from the installed copy
        shell: bash
        run: python "$HOME/.claude/skills/super-skill/install.py" --doctor
